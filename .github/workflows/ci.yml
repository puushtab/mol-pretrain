name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      # Through the Makefile rather than by repeating its commands. This file
      # held its own `uv sync --all-groups`, which installs the groups and none
      # of the extras, so the moment a test imported polars the whole run died
      # at collection. Calling the documented targets means CI tests the
      # environment a person actually gets, and the two cannot drift again.
      - run: make setup
      - run: make lint
      - run: make test
