# Pretraining recipe. Fixed across corpora so that the corpus is the only variable.
# Recipe follows CheMeleon (Burns et al. 2026): Chemprop D-MPNN + descriptor-prediction objective.
model:
  hidden_size: 300
  depth: 5
objective: descriptor_prediction   # mordred descriptors, as in CheMeleon
budget:
  epochs: 10                        # fixed budget: same steps per corpus, not same time
  batch_size: 64
  lr: 1.0e-4
seed: 0
